version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: dotnet_postgres_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ChangeMe08
      POSTGRES_DB: my_database
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: dotnet_api
    ports:
      - "5080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=my_database;Username=postgres;Password=ChangeMe08
    depends_on:
      - postgres

volumes:
  postgres_data:
